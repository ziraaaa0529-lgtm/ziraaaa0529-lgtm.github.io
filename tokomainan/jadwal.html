<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Mainan - Jadwal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;
            background:
                linear-gradient(135deg, #eeeeee 25%, transparent 25%) -20px 0,
                linear-gradient(225deg, #eeeeee 25%, transparent 25%) -20px 0,
                linear-gradient(315deg, #eeeeee 25%, transparent 25%),
                linear-gradient(45deg, #eeeeee 25%, #f9f9f9 25%);
            background-size: 80px 80px;
        }

        .container {
            width: 90%;
            max-width: 750px;
            margin: auto;
            text-align: center;
        }

        .logo {
            font-size: 100px;
            margin-top: 35px;
        }

        nav {
            margin: 15px 0 50px;
            font-size: 20px;
        }

        nav a {
            color: #4b168c;
            font-weight: bold;
            margin: 0 8px;
        }

        hr {
            border: none;
            border-top: 1px solid #999;
        }

        h1 {
            text-align: left;
            font-size: 38px;
            margin-top: 50px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 550px;
            margin-top: 35px;
            background: rgba(255,255,255,0.8);
            font-size: 20px;
        }

        th, td {
            border: 1px solid #333;
            padding: 20px;
            text-align: left;
        }

        th {
            font-size: 22px;
        }

        .catatan {
            font-style: italic;
            font-size: 19px;
            margin-top: 25px;
            text-align: left;
        }

        footer {
            margin: 70px 0 30px;
            color: #666;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Logo -->
    <div class="logo">🧸</div>

    <!-- Menu -->
    <nav>
        <a href="index.html">Beranda</a> |
        <a href="jadwal.html">Jadwal</a>
    </nav>

    <hr>

    <h1>Jam Operasional Toko</h1>

    <table>
        <tr>
            <th>Hari</th>
            <th>Jam Buka</th>
        </tr>

        <tr>
            <td>Senin - Jumat</td>
            <td>09.00 - 21.00</td>
        </tr>

        <tr>
            <td>Sabtu - Minggu</td>
            <td>10.00 - 22.00</td>
        </tr>
    </table>

    <p class="catatan">
        Format waktu dalam WIB
    </p>

    <footer>
        Created by Toko Mainan Ceria @2026
    </footer>

</div>

</body>
</html>
